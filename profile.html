<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ff751f">
    <link rel="manifest" href="manifest.webmanifest">
    <title>KBU PULSE - Profile</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    <script src="js/navbar.js"></script>
</head>
<body>
    <nav class="navbar" id="navbar"></nav>

    <main class="content-wrapper">
        <!-- SHOWN when NOT logged in -->
        <div id="profile-guest" style="display: none;" class="guest-message">
            <h2 class="section-title">Please log in to view your profile</h2>
            <a href="login.html" class="btn btn-primary">Login</a>
        </div>

        <!-- SHOWN when logged in -->
        <div id="profile-content" style="display: none;">
            <div class="profile-header">
                <img id="user-avatar" class="profile-avatar" alt="Profile avatar">
                <div>
                    <h1 class="page-title" id="user-name">My Profile</h1>
                    <p id="user-email" class="text-muted"></p>
                    <p id="user-major" class="text-muted"></p>
                    <p id="user-created-at" class="text-muted"></p>
                </div>
                <button class="btn btn-secondary" id="logout-btn">Logout</button>
            </div>

            <div class="tabs" role="tablist" aria-label="Profile sections">
                <button class="tab" id="my-events-tab" data-profile-tab="events" role="tab">My Events</button>
                <button class="tab" id="my-comments-tab" data-profile-tab="comments" role="tab">My Comments</button>
            </div>

            <section id="my-events-section" class="profile-section" role="tabpanel">
                <div id="my-events-list" class="event-grid"></div>
                <div id="my-events-pagination" class="pagination-row"></div>
            </section>
            <section id="my-comments-section" class="profile-section" role="tabpanel">
                <div id="my-comments-list" class="comment-list"></div>
                <div id="my-comments-pagination" class="pagination-row"></div>
            </section>
        </div>
    </main>
    <script type="module" src="js/main.js"></script>
</body>
</html>
