<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBU PULSE - Forgot Password</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    <script src="js/navbar.js"></script>
</head>
<body>
    <nav class="navbar" id="navbar"></nav>

    <main class="page-center">
        <div class="auth-card">
            <h2 class="auth-title">Forgot Password</h2>
            <p class="auth-subtitle">Enter your email and we'll send you a reset code.</p>

            <form id="forgot-form" class="form-stack" method="post" action="#">
                <div>
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-input" required placeholder="yourid@ms.kbu.ac.th">
                </div>

                <button type="submit" class="btn btn-primary">Send Reset Code</button>

                <p class="form-hint" id="otp-hint" hidden>Dev hint: your code is <strong id="otp-display"></strong></p>
                <button type="button" class="btn btn-primary" id="continue-reset" hidden>Continue to Reset Password</button>

                <p class="form-footer">
                    Remembered it? <a href="login.html">Back to Login</a>
                </p>
            </form>
        </div>
    </main>
    <script type="module" src="js/main.js"></script>
</body>
</html>
