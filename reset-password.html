<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ff751f">
    <link rel="manifest" href="manifest.webmanifest">
    <title>KBU PULSE - Reset Password</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    <script src="js/navbar.js"></script>
</head>
<body>
    <nav class="navbar" id="navbar"></nav>

    <main class="page-center">
        <div class="auth-card">
            <h2 class="auth-title">Reset Password</h2>
            <p class="auth-subtitle">Enter the code we emailed you and choose a new password.</p>

            <form id="reset-form" class="form-stack" method="post" action="#">
                <div>
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-input" required placeholder="yourid@ms.kbu.ac.th">
                </div>
                <div>
                    <label class="form-label">Verification Code</label>
                    <input type="text" name="code" class="form-input" inputmode="numeric" maxlength="6" placeholder="123456" required>
                </div>
                <div>
                    <label class="form-label">New Password</label>
                    <input type="password" name="password" class="form-input" required minlength="6">
                </div>
                <div>
                    <label class="form-label">Confirm New Password</label>
                    <input type="password" name="confirmPassword" class="form-input" required>
                </div>

                <button type="submit" class="btn btn-primary">Reset Password</button>

                <p class="form-footer">
                    <a href="login.html">Back to Login</a>
                </p>
            </form>
        </div>
    </main>
    <script type="module" src="js/main.js"></script>
</body>
</html>
