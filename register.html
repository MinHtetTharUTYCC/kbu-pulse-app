<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBU PULSE - Register</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <script src="js/navbar.js"></script>
</head>
<body>
    <nav class="navbar" id="navbar"></nav>

    <main class="min-vh-100 flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-md border rounded-lg p-8 shadow-card" style="width: 100%;">
            <h2 class="text-xl font-bold text-center mb-6">Create Account</h2>

            <form id="register-form" class="space-y-4" method="post" action="#">
                <div>
                    <label class="block text-sm font-medium mb-2">Full Name</label>
                    <input type="text" name="fullName" class="form-input" required>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Email</label>
                    <input type="email" name="email" class="form-input" required placeholder="yourid@ms.kbu.ac.th">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Major</label>
                    <select name="major" class="form-input">
                        <option value="">Select Major</option>
                        <option value="DTI">DTI</option>
                        <option value="BBA">BBA</option>
                        <option value="APDI">APDI</option>
                        <option value="CIVIL">Civil</option>
                        <option value="MECHANICAL">Mechanical</option>
                        <option value="ELECTRICAL">Electrical</option>
                        <option value="ARCHITECTURE">Architecture</option>
                        <option value="IT">IT</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Password</label>
                    <input type="password" name="password" class="form-input" required>
                </div>

                <button type="submit" class="btn btn-primary w-full">Register</button>

                <p class="text-center text-sm mt-4">
                    Already have an account? <a href="login.html">Login</a>
                </p>
            </form>
        </div>
    </main>
    <script type="module" src="js/main.js"></script>
</body>
</html>
