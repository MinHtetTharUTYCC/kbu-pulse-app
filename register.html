<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBU PULSE - Register</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    <script src="js/navbar.js"></script>
</head>
<body>
    <nav class="navbar" id="navbar"></nav>

    <main class="page-center">
        <div class="auth-card" id="register-card">
            <h2 class="auth-title">Create Account</h2>

            <form id="register-form" class="form-stack" method="post" action="#">
                <div>
                    <label class="form-label">Full Name</label>
                    <input type="text" name="fullName" class="form-input" required>
                </div>
                <div>
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-input" required placeholder="yourid@ms.kbu.ac.th">
                </div>
                <div>
                    <label class="form-label">Major</label>
                    <select name="major" class="form-input">
                        <option value="">Select Major</option>
                        <option value="DTI">DTI</option>
                        <option value="BBA">BBA</option>
                        <option value="APDI">APDI</option>
                        <option value="CIVIL">Civil</option>
                        <option value="MECHANICAL">Mechanical</option>
                        <option value="ELECTRICAL">Electrical</option>
                        <option value="ARCHITECTURE">Architecture</option>
                        <option value="IT">IT</option>
                    </select>
                </div>
                <div>
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-input" required minlength="6">
                </div>
                <div>
                    <label class="form-label">Confirm Password</label>
                    <input type="password" name="confirmPassword" class="form-input" required>
                </div>

                <button type="submit" class="btn btn-primary">Register</button>

                <p class="form-footer">
                    Already have an account? <a href="login.html">Login</a>
                </p>
            </form>
        </div>

        <div class="auth-card" id="otp-step" hidden>
            <h2 class="auth-title">Verify Your Email</h2>
            <p class="auth-subtitle">We sent a 6-digit code to <span id="otp-email"></span>.</p>

            <form id="otp-form" class="form-stack" method="post" action="#">
                <div>
                    <label class="form-label">Verification Code</label>
                    <input type="text" name="code" class="form-input" inputmode="numeric" maxlength="6" placeholder="123456" required>
                </div>
                <p class="form-hint" id="otp-hint" hidden>Dev hint: your code is <strong id="otp-display"></strong></p>

                <button type="submit" class="btn btn-primary">Verify Email</button>

                <p class="form-footer">
                    Wrong email? <a href="#" id="back-to-form">Go back</a>
                </p>
            </form>
        </div>
    </main>
    <script type="module" src="js/main.js"></script>
</body>
</html>
