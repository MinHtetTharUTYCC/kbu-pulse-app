<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBU PULSE - Events</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    <script src="js/navbar.js"></script>
</head>
<body>
    <nav class="navbar" id="navbar"></nav>

    <main class="page-content">
        <div class="page-header">
            <h3 class="page-title">KBU PULSE</h3>
            <p class="text-muted">See what is going on at KBU!</p>
        </div>

        <div class="event-filters">
            <select class="filter-select" id="category-filter">
                <option value="">All Categories</option>
                <option value="HACKATHON">Hackathon</option>
                <option value="CAPSTONE">Capstone</option>
                <option value="STUDY_GROUP">Study Group</option>
                <option value="WORKSHOP">Workshop</option>
                <option value="SEMINAR">Seminar</option>
                <option value="CLUB_EVENT">Club Event</option>
                <option value="COMPETITION">Competition</option>
                <option value="OTHER">Other</option>
            </select>
            <select class="filter-select" id="major-filter">
                <option value="">All Majors</option>
                <option value="DTI">DTI</option>
                <option value="BBA">BBA</option>
                <option value="APDI">APDI</option>
                <option value="CIVIL">Civil</option>
                <option value="MECHANICAL">Mechanical</option>
                <option value="ELECTRICAL">Electrical</option>
                <option value="ARCHITECTURE">Architecture</option>
                <option value="IT">IT</option>
            </select>
            <select class="filter-select" id="sort-filter">
                <option value="newest">Newest</option>
                <option value="popular">Popular</option>
            </select>
            <input type="text" class="search-input" placeholder="Search events..." id="search-input">
        </div>

        <div id="event-list" class="event-grid">
        </div>

        <div id="pagination" class="pagination-row"></div>
    </main>
    <script type="module" src="js/main.js"></script>
</body>
</html>
