<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBU PULSE - Event Detail</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    <script src="js/navbar.js"></script>
</head>
<body>
    <nav class="navbar" id="navbar"></nav>

    <main class="detail-layout p-4">
        <div class="detail-main">
            <div id="event-header" class="card"></div>
        </div>
        <div class="detail-sidebar">
            <div class="event-actions card mb-4" style="display: none;">
                <div style="display: flex; gap: 0.75rem; align-items: center;">
                    <button class="btn-icon upvote-btn" data-event-id="" style="flex: 1; justify-content: center; gap: 0.4rem;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg><span class="upvote-text">Upvotes</span></button>
                    <button class="btn-icon save-btn" data-event-id="" style="flex: 1; justify-content: center; gap: 0.4rem;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg><span class="save-text">Save</span></button>
                </div>
            </div>

            <section class="card mb-4">
                <h3 class="text-lg font-bold mb-3">Comments <span id="comment-count" class="text-muted text-sm"></span></h3>

                <form id="comment-form" class="comment-form" style="display: none;">
                    <textarea placeholder="Write a comment..." rows="2" required></textarea>
                    <button type="submit" class="btn btn-primary">Post Comment</button>
                </form>

                <div id="comment-list" class="space-y-3"></div>
                <div id="comment-pagination" class="mt-3 flex justify-center"></div>
            </section>
        </div>
    </main>
    <script type="module" src="js/main.js"></script>
</body>
</html>
