<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBU PULSE - Event Detail</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    <script src="js/navbar.js"></script>
</head>
<body>
    <nav class="navbar" id="navbar"></nav>

    <main class="detail-layout p-4">
        <div class="detail-main">
            <div id="event-header" class="card"></div>
        </div>
        <div class="detail-sidebar">
            <div class="event-actions card mb-4" style="display: none;">
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <button class="btn-icon upvote-btn" data-event-id=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg><span></span></button>
                    <button class="btn-icon save-btn" data-event-id=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button>
                </div>
            </div>

            <section class="card mb-4">
                <h3 class="text-lg font-bold mb-3">Comments <span id="comment-count" class="text-muted text-sm"></span></h3>
                <div id="comment-list" class="space-y-3"></div>
            </section>

            <form id="comment-form" style="display: none;">
                <textarea placeholder="Write a comment..." rows="2" required></textarea>
                <button type="submit" class="btn btn-primary mt-2">Post Comment</button>
            </form>
        </div>
    </main>
    <script type="module" src="js/main.js"></script>
</body>
</html>
