<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBU PULSE - Event Detail</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    <script src="js/navbar.js"></script>
</head>
<body>
    <nav class="navbar" id="navbar"></nav>

    <main class="max-w-2xl mx-auto p-4">
        <div id="event-header" class="mb-6 card"></div>

        <div class="mb-4 event-actions" style="display: none;">
            <div style="display: flex; gap: 1rem;">
                <button class="btn-icon upvote-btn" data-event-id=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg></button>
                <button class="btn-icon save-btn" data-event-id=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button>
            </div>
        </div>

        <section class="mt-8 card">
            <h3 class="text-lg font-bold mb-3">Comments</h3>
            <div id="comment-list" class="space-y-3"></div>
        </section>

        <form id="comment-form" class="mt-4" style="display: none;">
            <textarea placeholder="Write a comment..." rows="2" required></textarea>
            <button type="submit" class="btn btn-primary mt-2">Post Comment</button>
        </form>
    </main>
    <script type="module" src="js/main.js"></script>
</body>
</html>
