<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBU PULSE - Login</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    <script src="js/navbar.js"></script>
</head>
<body>
    <nav class="navbar" id="navbar"></nav>

    <main class="page-center">
        <div class="auth-card">
            <h2 class="auth-title">Welcome Back</h2>

            <form id="login-form" class="form-stack" method="post" action="#">
                <div>
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-input" required placeholder="yourid@ms.kbu.ac.th">
                </div>
                <div>
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-input" required placeholder="Enter your password">
                </div>

                <button type="submit" class="btn btn-primary">Login</button>

                <p class="form-footer">
                    Don't have an account? <a href="register.html">Register</a>
                </p>
            </form>
        </div>
    </main>
    <script type="module" src="js/main.js"></script>
</body>
</html>
