<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBU PULSE - Login</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <script src="js/navbar.js"></script>
</head>
<body>
    <nav class="navbar" id="navbar"></nav>

    <main class="min-vh-100 flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-md border rounded-lg p-8 shadow-card" style="width: 100%;">
            <h2 class="text-xl font-bold text-center mb-6">Welcome Back</h2>

            <form id="login-form" class="space-y-4" method="post" action="#">
                <div>
                    <label class="block text-sm font-medium mb-2">Email</label>
                    <input type="email" name="email" class="form-input" required>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Password</label>
                    <input type="password" name="password" class="form-input" required>
                </div>

                <button type="submit" class="btn btn-primary w-full">Login</button>

                <p class="text-center text-sm mt-4">
                    Don't have an account? <a href="register.html">Register</a>
                </p>
            </form>
        </div>
    </main>
    <script type="module" src="js/main.js"></script>
</body>
</html>
