<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ff751f">
    <link rel="manifest" href="manifest.webmanifest">
    <title>KBU PULSE - Edit Event</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    <script src="js/navbar.js"></script>
</head>
<body>
    <nav class="navbar" id="navbar"></nav>
    <main class="content-wrapper">
        <div id="edit-event-guest" style="display: none;" class="guest-message">
            <h2 class="section-title">Please log in to edit this event</h2>
            <a href="login.html" class="btn btn-primary">Login</a>
        </div>
        <div id="edit-event-content" class="form-box" style="display: none;">
            <h1 class="page-title">Edit Event</h1>
            <p id="edit-event-error" class="text-error" style="display: none;"></p>
            <form id="edit-event-form" class="form-stack">
                <div><label class="form-label">Title</label><input type="text" name="title" class="form-input" required></div>
                <div><label class="form-label">Description</label><textarea name="description" class="form-input" rows="3" required></textarea></div>
                <div><label class="form-label">Category</label><select name="category" class="form-input" required>
                    <option value="">Select Category</option><option value="HACKATHON">Hackathon</option><option value="CAPSTONE">Capstone</option><option value="STUDY_GROUP">Study Group</option><option value="WORKSHOP">Workshop</option><option value="SEMINAR">Seminar</option><option value="CLUB_EVENT">Club Event</option><option value="COMPETITION">Competition</option><option value="OTHER">Other</option>
                </select></div>
                <div><label class="form-label">Major <span class="text-muted">(optional)</span></label><select name="major" class="form-input">
                    <option value="">All Majors</option><option value="DTI">DTI</option><option value="BBA">BBA</option><option value="APDI">APDI</option><option value="CIVIL">Civil</option><option value="MECHANICAL">Mechanical</option><option value="ELECTRICAL">Electrical</option><option value="ARCHITECTURE">Architecture</option><option value="IT">IT</option>
                </select></div>
                <div><label class="form-label">Existing images</label><div id="existing-images" class="image-preview"></div></div>
                <div><label class="form-label">Add images <span class="text-muted">(up to 4 total)</span></label><input type="file" id="event-images" multiple accept="image/png,image/jpeg,image/jpg,image/webp,image/heic,image/heif" class="form-input"><div id="image-preview" class="image-preview"></div></div>
                <div class="form-actions"><button type="button" class="btn btn-secondary" onclick="goBack()">Cancel</button><button type="submit" class="btn btn-primary">Save Changes</button></div>
            </form>
        </div>
    </main>
    <script type="module" src="js/main.js"></script>
</body>
</html>
